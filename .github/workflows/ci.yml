name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ruff && pipx install actionlint-py
      - run: ruff check .
      - run: ruff format --check .
      - run: actionlint

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    # Python 3.9 is the floor: the packages of material-grub already require it, and the vendored colour science (material_boot/_vendor) uses
    # `list[float]` annotations, which crash on 3.8 (found by this matrix). 3.13 is the newest in use. Pinned to 24.04, which has the old setup-python builds.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pillow    # the renderer needs it; the pure modules are tested without it in a subprocess (tests/test_skeleton.py)
      - run: python -m unittest discover -s tests -v

  snapshot:
    # The render snapshot (tests/snapshot): material-grub's own scenes, rendered by the real commands, must hash exactly as tests/snapshot/golden.json says.
    # The baseline run proves the golden is reproducible on another machine; the --core run is the "no pixel changed" gate for every module that moved here.
    name: Render snapshot (identical pixels)
    runs-on: ubuntu-24.04
    env:
      MATERIAL_GRUB_REF: ${{ vars.MATERIAL_GRUB_REF || 'release/0.8.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y grub-common librsvg2-bin
      - run: pip install --require-hashes -r material-grub/requirements.txt
      - name: Build the dark and the light package
        working-directory: material-grub
        run: |
          python scripts/package.py --res 1920x1080
          mv dist/material-grub "$RUNNER_TEMP/pkg-dark"
          python scripts/package.py --res 1920x1080 --scheme light
          mv dist/material-grub "$RUNNER_TEMP/pkg-light"
      - name: The golden reproduces from material-grub's own modules (baseline)
        run: >
          python tests/snapshot/snapshot.py --bin material-grub/install/bin
          --pkg-dark "$RUNNER_TEMP/pkg-dark" --pkg-light "$RUNNER_TEMP/pkg-light"
      - name: The golden reproduces with this repository's modules (the gate for every move)
        run: >
          python tests/snapshot/snapshot.py --core --bin material-grub/install/bin
          --pkg-dark "$RUNNER_TEMP/pkg-dark" --pkg-light "$RUNNER_TEMP/pkg-light"
      - name: The shared data this repository builds equals what material-grub builds (dark and light)
        run: |
          python scripts/build_data.py --out "$RUNNER_TEMP/data-dark"
          python scripts/compare_data.py "$RUNNER_TEMP/data-dark" "$RUNNER_TEMP/pkg-dark"
          python scripts/build_data.py --out "$RUNNER_TEMP/data-light" --scheme light
          python scripts/compare_data.py "$RUNNER_TEMP/data-light" "$RUNNER_TEMP/pkg-light"
      - name: Renderer tests that need a built package
        run: python -m unittest -v tests.test_panel tests.test_custom
        env:
          MATERIAL_PKG: ${{ runner.temp }}/pkg-dark
