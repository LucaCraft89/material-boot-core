name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ruff && pipx install actionlint-py
      - run: ruff check .
      - run: ruff format --check .
      - run: actionlint
      - run: for f in material_boot/ui/web/*.js; do node --check "$f"; done      # the editor's front end has no build step: a syntax error would only show in the browser

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    # Python 3.9 is the floor: the packages of material-grub already require it, and the vendored colour science (material_boot/_vendor) uses
    # `list[float]` annotations, which crash on 3.8 (found by this matrix). 3.13 is the newest in use. Pinned to 24.04, which has the old setup-python builds.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pillow    # the renderer needs it; the pure modules are tested without it in a subprocess (tests/test_skeleton.py)
      - run: python -m unittest discover -s tests -v
      - run: python scripts/gen_man.py --check      # the man page is made from the same table as --help
      - run: python scripts/gen_ui_tokens.py && git diff --exit-code material_boot/ui/web/tokens.css      # the editor's colours are generated, never edited by hand

  snapshot:
    # The render snapshot (tests/snapshot): material-grub's own scenes, rendered by the real commands, must hash exactly as tests/snapshot/golden.json says.
    # The baseline run proves the golden is reproducible on another machine; the --core run is the "no pixel changed" gate for every module that moved here.
    name: Render snapshot (identical pixels)
    runs-on: ubuntu-24.04
    env:
      # The BASELINE of the gates below (the picture snapshot, the suites gate, the provenance test) is material-grub as it was BEFORE it started using this core
      # (merge of #16 into release/0.8.0): they compare the moved code with the original. Pinned to that commit, so that material-grub's own move to the core
      # (G1) does not turn the baseline into a copy of this repository. The reverse check, material-grub's suites running on this core, is material-grub's CI.
      MATERIAL_GRUB_REF: ${{ vars.MATERIAL_GRUB_REF || '588f909868d71d7fa0c76125b483ded568a04a28' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucaCraft89/material-grub
          ref: ${{ env.MATERIAL_GRUB_REF }}
          path: material-grub
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install -y grub-common librsvg2-bin
      - run: pip install --require-hashes -r material-grub/requirements.txt
      - name: Build the dark and the light package
        working-directory: material-grub
        run: |
          python scripts/package.py --res 1920x1080
          mv dist/material-grub "$RUNNER_TEMP/pkg-dark"
          python scripts/package.py --res 1920x1080 --scheme light
          mv dist/material-grub "$RUNNER_TEMP/pkg-light"
      - name: The golden reproduces from material-grub's own modules (baseline)
        run: >
          python tests/snapshot/snapshot.py --bin material-grub/install/bin
          --pkg-dark "$RUNNER_TEMP/pkg-dark" --pkg-light "$RUNNER_TEMP/pkg-light"
      - name: The golden reproduces with this repository's modules (the gate for every move)
        run: >
          python tests/snapshot/snapshot.py --core --bin material-grub/install/bin
          --pkg-dark "$RUNNER_TEMP/pkg-dark" --pkg-light "$RUNNER_TEMP/pkg-light"
      - name: The shared data this repository builds equals what material-grub builds (dark and light)
        run: |
          python scripts/build_data.py --out "$RUNNER_TEMP/data-dark"
          python scripts/compare_data.py "$RUNNER_TEMP/data-dark" "$RUNNER_TEMP/pkg-dark"
          python scripts/build_data.py --out "$RUNNER_TEMP/data-light" --scheme light
          python scripts/compare_data.py "$RUNNER_TEMP/data-light" "$RUNNER_TEMP/pkg-light"
      - name: material-grub's own unit suites pass on the core's code (every suite that passes on material-grub's own must pass on the core's)
        timeout-minutes: 25
        run: python tests/gate/grub_suites.py --grub material-grub --pkg "$RUNNER_TEMP/pkg-dark"
      - name: Moved code is the original code (syntax trees equal)
        run: python -m unittest -v tests.test_provenance
        env:
          MATERIAL_GRUB: ${{ github.workspace }}/material-grub
      - name: The core installs itself, and a bundle installs from its unpacked tree (real data build on a staged root)
        run: python -m unittest -v tests.test_coreinstall tests.test_bundle
      - name: Renderer tests that need a built package
        run: python -m unittest -v tests.test_panel tests.test_custom
        env:
          MATERIAL_PKG: ${{ runner.temp }}/pkg-dark

  packages:
    # The three package formats of the core: build each from the checked-out tree, install it in a distro container (the dependencies come from the package's
    # own requirements, the shared data is built on install), use the command, change the scheme, upgrade, break the data build on purpose (the package manager
    # must still succeed and the old data stays), and remove it (nothing generated is left behind).
    name: Package ${{ matrix.fmt }} (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fmt: rpm,  name: Fedora, image: "registry.fedoraproject.org/fedora:latest"}
          - {fmt: deb,  name: Debian, image: "docker.io/library/debian:stable"}
          - {fmt: arch, name: Arch,   image: "docker.io/library/archlinux:latest"}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build/pkg build/out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/pkg:/out" "${{ matrix.image }}" sh /src/tests/containers/build_pkg.sh ${{ matrix.fmt }}
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/pkg:/pkg:ro" -v "$PWD/build/out:/out" "${{ matrix.image }}" sh /src/tests/containers/pkg_smoke.sh ${{ matrix.fmt }}
      - run: cat build/out/pkg-${{ matrix.fmt }}.txt; grep -q "^ALL OK" build/out/pkg-${{ matrix.fmt }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "package-${{ matrix.fmt }}", path: build/out/}


  editor:
    # The editor in a real browser (Chrome, driven by Playwright): every page, the live preview, drag and drop, edits, Apply through the real helper (scratch root,
    # fake `material-boot`), a failing Apply, Ventoy (drawn with the real GRUB package), the update page, phone width, dark and light, and the browser-side
    # security. The GRUB part is checked out beside this repository: the entry preview and the Ventoy pages are its. Screenshots are artifacts.
    name: The editor in Chrome (end to end)
    runs-on: ubuntu-latest
    env:
      PART_GRUB_REF: ${{ vars.PART_GRUB_REF || 'release/1.2.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: LucaCraft89/material-grub, ref: "${{ env.PART_GRUB_REF }}", path: parts-grub}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin grub-common
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install playwright   # test tooling only; the browser is the runner's Chrome
      - run: ln -sfn "$GITHUB_WORKSPACE" parts-grub/material-boot-core && cd parts-grub && python3 scripts/package.py --res 1920x1080   # the part finds the core next to it
      - run: >
          MATERIAL_GRUB_SRC="$PWD/parts-grub" MATERIAL_GRUB_PKG="$PWD/parts-grub/dist/material-grub"
          GUI_BROWSER=/usr/bin/google-chrome .venv/bin/python tests/ui_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: editor-screenshots, path: build/ui-shots/}

  bundle:
    # The whole unified installer, for real: a bundle made of this core and the REAL parts (material-grub, material-plymouth, from the refs below), installed in a
    # distro container with a fake /boot: a dry run changes nothing; GRUB is installed (the default part), then Plymouth (a real initramfs rebuild with the
    # distro's own tool, checked); doctor has a section per part; both are removed again (grub.cfg as before, the image without the theme) and the core stays.
    name: The bundle with the real parts (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora, image: "registry.fedoraproject.org/fedora:latest"}
          - {name: Debian, image: "docker.io/library/debian:stable"}
          - {name: Ubuntu, image: "docker.io/library/ubuntu:24.04"}
          - {name: Arch,   image: "docker.io/library/archlinux:latest"}
          - {name: openSUSE, image: "registry.opensuse.org/opensuse/tumbleweed:latest"}
    env:
      PART_GRUB_REF: ${{ vars.PART_GRUB_REF || 'release/1.2.0' }}
      PART_PLYMOUTH_REF: ${{ vars.PART_PLYMOUTH_REF || 'release/1.2.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: LucaCraft89/material-grub, ref: "${{ env.PART_GRUB_REF }}", path: parts-grub}
      - uses: actions/checkout@v4
        with: {repository: LucaCraft89/material-plymouth, ref: "${{ env.PART_PLYMOUTH_REF }}", path: parts-plymouth}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin
      - run: python3 scripts/build_bundle.py --out build/bundle --part grub=parts-grub --part plymouth=parts-plymouth
      - name: The screen against the real parts' questions
        run: python3 tests/check_bundle_questions.py "build/bundle/material-boot-$(cat VERSION)"
      - run: |
          mkdir -p build/out
          docker run --rm -v "$PWD/build/bundle/material-boot-$(cat VERSION):/bundle:ro" -v "$PWD:/src:ro" -v "$PWD/build/out:/out" "${{ matrix.image }}" sh /src/tests/containers/bundle_smoke.sh
      - run: cat build/out/bundle-smoke.txt; grep -q "^ALL OK" build/out/bundle-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "bundle-smoke-${{ matrix.name }}", path: build/out/}

  deps:
    # The installer installs what it needs: a system with Python and nothing else (no Pillow, no SVG rasteriser) gets them from its own package manager.
    # (The 1.0.0 bundle failed here on a real machine; the other jobs install these in their image setup, so they could not see it.)
    name: Installs its own dependencies (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Fedora, image: "registry.fedoraproject.org/fedora:latest"}
          - {name: Debian, image: "docker.io/library/debian:stable"}
          - {name: Ubuntu, image: "docker.io/library/ubuntu:24.04"}
          - {name: Arch,   image: "docker.io/library/archlinux:latest"}
          - {name: openSUSE, image: "registry.opensuse.org/opensuse/tumbleweed:latest"}
    env:
      PART_GRUB_REF: ${{ vars.PART_GRUB_REF || 'release/1.2.0' }}
      PART_PLYMOUTH_REF: ${{ vars.PART_PLYMOUTH_REF || 'release/1.2.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: LucaCraft89/material-grub, ref: "${{ env.PART_GRUB_REF }}", path: parts-grub}
      - uses: actions/checkout@v4
        with: {repository: LucaCraft89/material-plymouth, ref: "${{ env.PART_PLYMOUTH_REF }}", path: parts-plymouth}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil librsvg2-bin
      - run: python3 scripts/build_bundle.py --out build/bundle --part grub=parts-grub --part plymouth=parts-plymouth
      - run: |
          mkdir -p build/out
          docker run --rm -v "$PWD/build/bundle/material-boot-$(cat VERSION):/bundle:ro" -v "$PWD:/src:ro" -v "$PWD/build/out:/out" "${{ matrix.image }}" sh /src/tests/containers/deps_smoke.sh
      - run: cat build/out/deps-smoke.txt; grep -q "^ALL OK" build/out/deps-smoke.txt
